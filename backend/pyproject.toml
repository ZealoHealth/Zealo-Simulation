[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zealo"
version = "0.1.0"
description = "Zealo Map — medicine inventory map and redistribution simulation for Gadag taluk, Karnataka"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.53,<0.54",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
pipeline = [
    "pdfplumber>=0.11.10,<0.12",
    "rapidfuzz>=3.14,<4",
    "requests>=2.32,<3",
    "scipy>=1.14,<2",
]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<0.29",
    "ruff>=0.9,<0.15",
]

[tool.setuptools.packages.find]
include = ["zealo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:zealo.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
